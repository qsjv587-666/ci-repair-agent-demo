name: Python CI

on:
  push:
    branches:
      - main
      - "fail/**"
  pull_request:
    branches:
      - main

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python3 -m pytest
